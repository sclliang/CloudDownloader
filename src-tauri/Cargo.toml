[package]
name = "clouddownloader"
version = "0.5.4"
description = "Cloud file and transfer manager for Windows"
authors = ["sclliang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clouddownloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart", "stream"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "net", "io-util", "fs"] }
futures-util = "0.3"
md-5 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"
percent-encoding = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
flate2 = "1"
num-bigint = "0.4"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
